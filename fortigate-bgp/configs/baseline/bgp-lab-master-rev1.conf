### VDOM-Link creation

config system vdom-link
    edit "R1R2-"
        set type ppp
    next
    edit "R1R3-1-"
        set type ppp
    next
    edit "R1R3-2-"
        set type ppp
    next
    edit "R1R4-"
        set type ppp
    next
    edit "R2R3-"
        set type ppp
    next
    edit "R2R4-"
        set type ppp
    next
    edit "R3R4-"
        set type ppp
    next
    edit "R3R9-"
        set type ppp
    next
    edit "R5R6-"
        set type ppp
    next
    edit "R6R7-"
        set type ppp
    next
    edit "R4NET1-"
        set type ethernet
    next
    edit "R5NET1-"
        set type ethernet
    next
    edit "R8NET1-"
        set type ethernet
    next
end


